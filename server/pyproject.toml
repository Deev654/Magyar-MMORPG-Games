[project]
name = "magyar-mmorpg-server"
version = "0.1.0"
description = "Alap MMORPG szerver modulok"
requires-python = ">=3.11"
authors = [{ name = "Magyar MMORPG Games közösség" }]
readme = "README.md"
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
dev = [
  "black==24.4.2",
  "ruff==0.3.4",
  "pytest==8.1.1"
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E", "F", "B", "I", "UP"]
fix = false
src = ["src", "tests"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = [
  "tests"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
